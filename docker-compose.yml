version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: parsons_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=parsons_puzzle
    networks:
      - parsons_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parsons_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=parsons_puzzle
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - CORS_ORIGINS=["http://localhost:3000"]
    depends_on:
      - mongodb
    volumes:
      - ./backend/app:/app/app
    networks:
      - parsons_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parsons_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - parsons_network

volumes:
  mongodb_data:

networks:
  parsons_network:
    driver: bridge
